          example: "PCI"

        cvv:
          type: string
          description: Card Verification Value (CVV).
          pattern: '^[0-9]{3,4}$'
          minLength: 3
          maxLength: 4
          example: "123"

        useExtendedBin:
          type: boolean
          description: Indicates whether extended BIN information should be used.
          example: false


