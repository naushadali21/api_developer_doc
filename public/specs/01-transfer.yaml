            * 50102009 - This error code returned if user give correct UIC.
            * 50102010 - The UniTeller identification code has been sent successfully.
            * 50103003 - This error code returned if request does not have all mandatory fields.
            * 50104009 - This error code returned if password entered by user doesn't match password pattern rule.
