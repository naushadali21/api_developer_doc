  /oauth/token:
    post:
      tags:
        - OAuth
      summary: Generate OAuth token.
      description: Authenticates the user and initiates the MFA verification process when MFA is required.

      security:
        - basicAuth: [ ]

      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/OAuthPasswordGrantRequest'
                - $ref: '#/components/schemas/OAuthMfaGrantRequest'
                - $ref: '#/components/schemas/OAuthRefreshGrantRequest'

              discriminator:
                propertyName: grant_type
                mapping:
                  password: '#/components/schemas/OAuthPasswordGrantRequest'
                  mfa: '#/components/schemas/OAuthMfaGrantRequest'
                  refresh_token: '#/components/schemas/OAuthRefreshGrantRequest'

            examples:
              OAuthTokenRequest:
                summary: OAuth Token Request
                value:
                  grant_type: "password"
                  deviceinfo: '{"flash":"NA","canvas":"dbc418051fbfeeef53caf58d8ec6f0c1","networkType":"4g","cookieEnabled":"true","display":"24|1366|768|1366|728","platform":"Win32","fonts":"5aa5563e9481d17ffe7055372d84b26b","java":"true","webgl":"true","language":"lang=en-US|syslang=|userlang=","os":"Windows","timezone":5.5,"touchSupport":"false","plugins":"Chrome PDF Plugin|Chrome PDF Viewer|Native Client","useragent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/80.0.3987.163 Safari/537.36","silverlight":"NA","audio":"2875c00d19f6220ec0b20ad4455602b090d63978"}'
                  username: "john.doe@email.com"

              MfaGrant:
                summary: MFA Grant - Verify MFA Code
                value:
                  grant_type: "mfa"
                  mfa_token: "<MFA_TOKEN>"
                  mfa_code: "221122"
                  is_trusted: true

              RefreshTokenGrant:
                summary: Refresh Token Grant
                value:
                  grant_type: "refresh_token"
                  refresh_token: "<REFRESH_TOKEN>"



      responses:
        '200':
          description: Authentication response. MFA may be required before an access token is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
              examples:
                PasswordGrantMfaRequired:
                  summary: Password Grant - MFA Required
                  description: Returned when the user's credentials are valid but MFA verification is required.
                  value:
                    error: "mfa_required"
                    mfa_methods:
                      - SMS
                    mfa_token: "<MFA_TOKEN>"
                    responseCode: "10105001"
                    responseMessage: "Please provide MFA Code. The MFA Code is sent on your Device."

                MfaGrantSuccessful:
                  summary: MFA Grant - Authentication Successful
                  description: Returned after successful MFA verification.
                  value:
                    access_token: "<ACCESS_TOKEN>"
                    token_type: "bearer"
                    refresh_token: "<REFRESH_TOKEN>"
                    expires_in: 1199
                    scope: "read write"
                    responseCode: "00000000"
                    responseMessage: "00000000"

                PasswordGrantSuccessful:
                  summary: Password Grant - Successful
                  description: Returns access and refresh tokens after successful password authentication.
                  value:
                    access_token: "<ACCESS_TOKEN>"
                    token_type: "bearer"
                    refresh_token: "<REFRESH_TOKEN>"
                    expires_in: 1199
                    scope: "read write"
                    responseCode: "00000000"
                    responseMessage: "00000000"

                RefreshTokenSuccessful:
                  summary: Refresh Token Grant - Authentication Successful
                  description: Returned after successfully exchanging a refresh token for a new access token.
                  value:
                    access_token: "<NEW_ACCESS_TOKEN>"
                    token_type: "bearer"
                    refresh_token: "<NEW_REFRESH_TOKEN>"
                    expires_in: 1199
                    scope: "read write"
                    responseCode: "00000000"
                    responseMessage: "00000000"

        '400':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
              examples:
                Unauthorized:
                  $ref: '#/components/examples/UnauthorizedResponse'


        '401':
          description: Unauthorized

        '500':
          description: Internal Server Error


