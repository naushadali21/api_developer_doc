components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained using the OAuth API with password as grant_type.

    clientbearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained using the OAuth API with clientCredentials as grant_type.

    basicAuth:
      type: http
      scheme: basic
      description: Basic Authentication credentials provided by Uniteller and passed in the header in parameter Authorization .
        
    
  

  parameters:

    AuthenticationCode:
      name: authentication_Code
      in: header
      required: true
      description: Authentication code assigned to the partner.
      schema:
        type: string
      example: Uniteller

    XForwardedFor:
      name: X-Forwarded-For
      in: header
      required: true
      description: Client IP Address.
      schema:
        type: string
        format: ipv4
      example: 10.72.12.25

    RegenerateVerificationEmailRequest:
      name: username
      in: query
      required: true
      description: Email address of the user for whom the verification email needs to be regenerated.
      schema:
        type: string
        format: email
      example: "john.doe@email.com"

    verifyEmailRequest:
      name: username
      in: query
      required: true
      description: Email address of the user.
      schema:
        type: string
        format: email
      example: "john.doe@email.com"

    VerifyEmailVerificationToken:
      name: verificationToken
      in: query
      required: true
      description: Verification token received by the user for email verification.
      schema:
        type: string
      example: "71912436"


  examples:
    InvalidPartnerCodeResponse:
      summary: Invalid Partner Code
      value:
        errorCode:
          errorCode: "59903001"
          errorMessage: "INVALID_PARTNER_CODE_STR"
          errorType: null
        extraFields: null
        interactionId: null
        executionTimestamp: null
        requestTimestamp: null
        responseTimestamp: null
        responseCode: "59903001"
        responseMessage: "INVALID_PARTNER_CODE_STR"
        contextId: null

    InvalidBirthDateResponse:
      summary: Invalid Birth Date
      value:
        errorCode:
          errorCode: "59903005"
          errorMessage: "Invalid birth date."
          errorType: "DEFAULT"
        extraFields: null
        interactionId: "1234"
        executionTimestamp: 30
        requestTimestamp: "07302026193940"
        responseTimestamp: "07302026193940"
        responseCode: "59903005"
        responseMessage: "Invalid birth date."
        contextId: "API_1546765610_1464803169"

    InvalidEmail:
      summary: Invalid Email
      value:
        errorCode:
          errorCode: "59903005"
          errorMessage: "Invalid email address."
          errorType: "DEFAULT"
        responseCode: "59903004"
        responseMessage: "Invalid email address."

    UnauthorizedResponse:
      summary: Invalid or expired token
      value:
        responseCode: "10104007"
        responseMessage: "invalid_token"
        errors: null

  schemas:

    SignupRequest:
      type: object
      properties:
        partnerCode:
          type: string
          minLength: 2
          maxLength: 20
          description: This information is provided by UniTeller and it should be exactly same as provided.

        interactionId:
          type: string
          minLength: 10
          maxLength: 10
          nullable: true
          description: This information is used to track the request and response. The interaction ID received in the request will be returned in the response.

        locale:
          type: string
          minLength: 2
          maxLength: 2
          nullable: true
          description: Locale. If no input is provided in the request, English will be used by default.

        privacyPolicyAgreement:
          type: string
          minLength: 1
          maxLength: 30
          description: Indicates whether the user has accepted the privacy policy.

        questionId:
          type: integer
          minimum: 1
          description: Selected signup security question ID.

        answer:
          type: string
          minLength: 1
          maxLength: 60
          description: Answer to the selected security question. It is used to verify the user's identity when required.

        answerHint:
          type: string
          minLength: 1
          maxLength: 60
          nullable: true
          description: Hint for the security answer. This can help the user remember the answer during account recovery.

        remitterPersonalInfo:
          $ref: '#/components/schemas/RemitterPersonalInfo'

      required:
        - partnerCode
        - interactionId
        - privacyPolicyAgreement
        - questionId
        - answer
        - remitterPersonalInfo

    RemitterPersonalInfo:
      type: object
      properties:
        emailAddress:
          type: string
          format: email
          minLength: 5
          maxLength: 50
          description: The remitter's email address.

        firstName:
          type: string
          minLength: 1
          maxLength: 30
          description: The remitter's first name. Special characters are not allowed.

        middleName:
          type: string
          minLength: 1
          maxLength: 30
          nullable: true
          description: The remitter's middle name. Special characters are not allowed.

        lastName:
          type: string
          minLength: 2
          maxLength: 30
          description: The remitter's last name. Special characters are not allowed.

        secondLastName:
          type: string
          minLength: 1
          maxLength: 30
          nullable: true
          description: The remitter's second last name. Special characters are not allowed.

        birthDate:
          type: string
          minLength: 8
          maxLength: 8
          example: "19950424"
          description: The remitter's date of birth. The date must be a valid birth date in yyyyMMdd format.

        cellPhone:
          type: string
          minLength: 7
          maxLength: 11
          pattern: '^[0-9]+$'
          description: The remitter's cell phone number. Only numeric characters are allowed. At least one of cellPhone, workPhone, or homePhone must be provided.

        workPhone:
          type: string
          minLength: 8
          maxLength: 15
          nullable: true
          description: The remitter's work phone number.

        homePhone:
          type: string
          minLength: 8
          maxLength: 15
          nullable: true
          description: The remitter's home phone number.

        optOutUniteller:
          type: string
          minLength: 1
          maxLength: 30
          nullable: true
          description: Indicates whether the remitter has opted out of UniTeller communications.

        optOutAffiliates:
          type: string
          minLength: 1
          maxLength: 30
          nullable: true
          description: Indicates whether the remitter has opted out of affiliate communications.

        optOutExternal:
          type: string
          minLength: 1
          maxLength: 30
          nullable: true
          description: Indicates whether the remitter has opted out of third-party communications.

        destinationCountryISOCode:
          type: string
          minLength: 2
          maxLength: 2
