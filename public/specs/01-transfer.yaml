        executionTimestamp:
          type: integer
          description: Execution time of the request in milliseconds.
          example: 1029

        requestTimestamp:
          type: string
          description: Timestamp when the request was received.
          example: "08252026162114"

        responseTimestamp:
          type: string
          description: Timestamp when the response was generated.
          example: "08252026162115"

        responseCode:
          type: string
          description: Response code indicating the result of the verification.
          example: "00000000"

        responseMessage:
          type: string
          description: Message describing the result of the verification.
          example: "Your information was successfully verified."

        contextId:
          type: string
          description: Unique context identifier for the request.
          example: "API_80c7ba03ff8fedc4_80c7ba03ff8fedc4"

