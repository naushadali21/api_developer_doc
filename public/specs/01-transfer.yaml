        - tokenScheme
        - cvv
        - useExtendedBin

      properties:

        tokenexid:
          type: string
          description: TokenEx vendor identifier obtained from the vendorId field in the response of the card authenticator API.
          minLength: 1
          example: "5397724232852547"

        timestamp:
          type: string
          description: Timestamp obtained from the timestamp field in the response of the card authenticator API.
          minLength: 1
          example: "20260826075840"

