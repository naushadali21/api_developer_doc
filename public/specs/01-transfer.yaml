    OAuthPasswordGrantRequest:
      type: object
      required:
        - grant_type
        - deviceinfo
        - username

      properties:
        grant_type:
          type: string
          enum:
            - password
          description: OAuth grant type used to initiate user authentication.
          example: "password"

        deviceinfo:
          type: string
          minLength: 1
          description: JSON-formatted device fingerprint and client environment information.
          example: '{"flash":"NA","canvas":"dbc418051fbfeeef53caf58d8ec6f0c1","networkType":"4g","cookieEnabled":"true","display":"24|1366|768|1366|728","platform":"Win32","fonts":"5aa5563e9481d17ffe7055372d84b26b","java":"true","webgl":"true","language":"lang=en-US|syslang=|userlang=","os":"Windows","timezone":5.5,"touchSupport":"false","plugins":"Chrome PDF Plugin|Chrome PDF Viewer|Native Client","useragent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/80.0.3987.163 Safari/537.36","silverlight":"NA","audio":"2875c00d19f6220ec0b20ad4455602b090d63978"}'

        username:
          type: string
          format: email
          minLength: 5
          maxLength: 254
          description: Email address of the user requesting authentication.
          example: "john.doe@email.com"

    OAuthRefreshGrantRequest:
      type: object
      required:
        - grant_type
        - refresh_token


      properties:
        grant_type:
          type: string
          enum:
            - refresh_token
          description: OAuth grant type used to initiate user authentication.
          example: "password"

        mfa_token:
          type: string
          minLength: 1
          description: Refresh token returned by the password grant .
          example: "<REFRESH_TOKEN>"

    OAuthMfaGrantRequest:
      type: object
      required:
        - grant_type
        - mfa_token
        - mfa_code
        - is_trusted

      properties:
        grant_type:
          type: string
          enum:
            - mfa
          description: OAuth grant type used to authenticate the user using multi-factor authentication.
          example: "mfa"

        mfa_token:
          type: string
          minLength: 1
          description: Temporary MFA token returned by the password grant when MFA verification is required.
          example: "<MFA_TOKEN>"

        mfa_code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
          description: Six-digit MFA verification code sent to the user's registered device.
          example: "221122"

        is_trusted:
          type: boolean
          description: Indicates whether the current device should be marked as a trusted device after successful MFA verification.
          example: true



    OAuthTokenResponse:
      type: object
      properties:

        access_token:
          type: string
          description: OAuth access token used to authenticate subsequent API requests.
          example: "<ACCESS_TOKEN>"

        token_type:
          type: string
          description: Type of the access token.
          example: "bearer"

        refresh_token:
          type: string
          description: Token used to obtain a new access token after the access token expires.
          example: "<REFRESH_TOKEN>"

        expires_in:
          type: integer
          format: int32
          description: Lifetime of the access token in seconds.
          example: 1199

        scope:
          type: string
          description: OAuth scopes granted to the authenticated user.
          example: "read write"

        responseCode:
          type: string
          description: Response code indicating the result of authentication.
          example: "00000000"

        responseMessage:
          type: string
          description: Message describing the authentication result.
          example: "00000000"

        error:
          type: string
          nullable: true
          description: Error identifier returned when additional authentication is required.
          example: null

        mfa_methods:
          type: string
          nullable: true
          description: MFA methods available for the user when additional authentication is required.
          example: "[\"SMS\"]"

        mfa_token:
          type: string
          nullable: true
          description: Temporary token used to complete MFA verification.
          example: "<MFA_TOKEN>"


