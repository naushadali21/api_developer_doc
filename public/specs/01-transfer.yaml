        - interactionId
        - extraFields
        - locale

      properties:

        userId:
          type: string
          format: email
          minLength: 5
          maxLength: 50
          description: Email address of the user whose information needs to be verified.
          example: "john.doe@email.com"

        sSN:
          type: string
          minLength: 9
          maxLength: 9
          pattern: '^[0-9]{9}$'
          description: Nine-digit Social Security Number (SSN) of the user.
          example: "666440532"

        partnerCode:
          type: string
          minLength: 2
          maxLength: 20
          description: This information is provided by UniTeller and it should be exactly same as provided.

        interactionId:
          type: string
          minLength: 1
          maxLength: 50
          description: Unique identifier for the interaction.
          example: "12345678"

        extraFields:
          type: array
          description: Additional fields associated with the information verification request.
          items:
            type: object
          example: [ ]

        locale:
          type: string
          nullable: true
          minLength: 2
          maxLength: 2
          description: Locale. If no input is provided in the request, English will be used by default.
          example: "EN"

    InformationVerificationResponse:
      type: object
      properties:

        errorCode:
          $ref: '#/components/schemas/ErrorCode'

        extraFields:
          type: object
          nullable: true
