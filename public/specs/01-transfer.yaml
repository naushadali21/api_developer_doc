openapi: 3.1.0

info:
  title: Uniteller Online Remittance API
  version: 2.0.0

servers:
  - url: https://sendsandbox.uniteller.org/UTLROnlineRemitAPI

tags:
  - name: OAuth
  - name: ProfileManagement
  - name: Security
  - name: Common
  - name: Remittance

paths:
  /UTLROnlineRemitAPI/Security/v2/Signup:
    post:
      tags:
        - Security
      summary: This resource saves signup information of remitter.
      description: |
        This source saves signup information (with some basic information)
                and provides an authentication code (on registered email address if
                required otherwise skip verifying email address based on Partner
                configuration). After successful authentication, user willbe able to
                login into the application. Now user can use almost all features of the
                application except send money and add sending method until he/she
                completes his/her personal information and verify his information.

      security:
        - clientbearerAuth: []

      parameters:
        - $ref: '#/components/parameters/AuthenticationCode'
        - $ref: '#/components/parameters/XForwardedFor'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            examples:
              SignupRequest:
                summary: Signup Request
                value:
                  partnerCode: "Uniteller"
                  interactionId: "12344"
                  locale: null
                  extraFields: null
                  privacyPolicyAgreement: "YES"
                  remiterReferral: null
                  userIPAddress: ""
                  agreementLocale: null
                  questionId: "1"
                  answer: "answer"
                  answerHint: "answer"
                  remitterPersonalInfo:
                    emailAddress: "john.doe@email.com"
                    firstName: "Zeb"
                    middleName: null
                    lastName: "Versa"
                    secondLastName: null
                    gender: ""
                    birthDate: "02251999"
                    cellPhone: "9993205321"
                    workPhone: null
                    homePhone: null
                    address:
                      address1: "222333 PEACHTREE PLACE"
                      address2: null
                      city: "Los Angles"
                      state: "AZ"
                      stateName: "Arizona"
                      country: "USA"
                      countryISOCode: "US"
                      zipCode: "90001"
                    destinationCountryISOCode: "MX"

      responses:
        '200':
          description: Signup successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
              examples:
                Success:
                  summary: Successful Signup
                  value:
                    errorCode:
                      errorCode: "00000000"
                      errorMessage: "Congratulations! You have signed up successfully."
                      errorType: "DEFAULT"
                    extraFields:
                      - name: "Unique_USER_ID"
                        value: "305405_306351"
                    interactionId: "12344"
                    executionTimestamp: 707
                    requestTimestamp: "07102026071109"
                    responseTimestamp: "07102026071110"
                    responseCode: "00000000"
                    responseMessage: "Congratulations! You have signed up successfully."
                    contextId: "API_8049056e72e95655_8049056e72e95655"

                InvalidPartnerCode:
                  $ref: '#/components/examples/InvalidPartnerCodeResponse'

                InvalidBirthDate:
                  $ref: '#/components/examples/InvalidBirthDateResponse'

                InvalidEmail:
                  $ref: '#/components/examples/InvalidEmail'

        '400':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
              examples:
                Unauthorized:
                  $ref: '#/components/examples/UnauthorizedResponse'



        '500':
          description: Invalid Request

        '401':
          description: Internal Server Error

  /UTLROnlineRemitAPI/Security/CheckDuplicateUser:
    post:
      tags:
        - Security
      summary: Check Duplicate User
      description: Checks whether a user already exists using either an email address or personal information.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthenticationCode'
        - $ref: '#/components/parameters/XForwardedFor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CheckDuplicateUserByEmailRequest'
                - $ref: '#/components/schemas/CheckDuplicateUserByPersonalInfoRequest'
            examples:
              CheckByEmail:
                summary: Check Duplicate User by Email
                value:
                  emailAddress: "john.doe@email.com"
                  partnerCode: "Uniteller"
                  interactionId: "123456789"
                  locale: "En"

              CheckByPersonalInfo:
                summary: Check Duplicate User by Personal Information
                value:
                  partnerCode: "Uniteller"
                  interactionId: "123456789"
                  locale: "En"
                  firstName: "Joe"
                  lastName: "Arora"
                  birthDate: "11301996"

      responses:
        '200':
          description: Duplicate user check completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckDuplicateUserResponse'
              examples:
                Success:
                  summary: Duplicate User Check Response
                  value:
                    errorCode:
                      errorCode: "00000000"
                      errorMessage: "Success."
                      errorType: "DEFAULT"
                    extraFields: null
                    interactionId: "123456789"
                    executionTimestamp: 151
                    requestTimestamp: "07132026063244"
                    responseTimestamp: "07132026063245"
                    responseCode: "00000000"
                    responseMessage: "Success."
                    contextId: "API_1924056618_1197363864"
                    userId: null

                InvalidPartnerCode:
                  $ref: '#/components/examples/InvalidPartnerCodeResponse'

        '400':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckDuplicateUserResponse'
              examples:
                Unauthorized:
                  $ref: '#/components/examples/UnauthorizedResponse'


        '401':
          description: Unauthorized

        '500':
          description: Internal Server Error

