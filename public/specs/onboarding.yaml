openapi: 3.1.0
info:
  title: Developer Platform OnBoarding API
  description: Interactive API reference for Managing onboarding.
  version: 1.0.0
servers:
  - url: https://send.uniteller.com
    description: Production Environment
  - url: https://sandbox.example.com/v1
    description: Sandbox Environment

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Pass your API bearer token in the authorization header.

security:
  - BearerAuth: []

paths:
  /onboarding:
    post:
      summary: Create a new user
      description: Initiates a onboarding.
      tags:
        - Onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - address
                - dob
              properties:
                full_name:
                  type: string
                  example: "Naushad Ali"
                address:
                  type: string
                  example: "street 123 new delhi, 110077"
                dob:
                  type: string
                  example: "22/11/2000"
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "tr_123456789"
                  status:
                    type: string
                    example: "processing"
                  created_at:
                    type: string
                    example: "2026-09-14T10:00:00Z"